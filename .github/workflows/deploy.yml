name: Deploy static site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML and CSS files (Linter)
        run: |
          echo "Запуск автоматической проверки файлов проекта..."
          test -f index.html && echo "Файл index.html найден"
          test -f style.css && echo "Файл style.css найден"
          grep -q "<!DOCTYPE html>" index.html && echo "Семантический DOCTYPE подтвержден"
          echo "Проверка HTML и CSS успешно пройдена!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
